<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <!-- Outer orange border -->
  <circle cx="150" cy="150" r="145" fill="none" stroke="#FF6B35" stroke-width="10"/>
  
  <!-- Background -->
  <circle cx="150" cy="150" r="140" fill="white"/>
  
  <!-- Two stylized figures -->
  <!-- Left figure (larger, blue) -->
  <circle cx="120" cy="100" r="8" fill="#1976D2"/>
  <path d="M120 108 Q110 120 105 130" stroke="#1976D2" stroke-width="6" fill="none" stroke-linecap="round"/>
  
  <!-- Right figure (smaller, orange) -->
  <circle cx="180" cy="105" r="6" fill="#FF6B35"/>
  <path d="M180 111 Q190 120 195 130" stroke="#FF6B35" stroke-width="5" fill="none" stroke-linecap="round"/>
  
  <!-- Open book -->
  <path d="M130 140 L150 130 L170 140 L150 150 Z" fill="none" stroke="#1976D2" stroke-width="3"/>
  <line x1="135" y1="135" x2="145" y2="135" stroke="#1976D2" stroke-width="1"/>
  <line x1="135" y1="138" x2="145" y2="138" stroke="#1976D2" stroke-width="1"/>
  <line x1="155" y1="135" x2="165" y2="135" stroke="#1976D2" stroke-width="1"/>
  <line x1="155" y1="138" x2="165" y2="138" stroke="#1976D2" stroke-width="1"/>
  
  <!-- Motto text -->
  <text x="120" y="170" font-family="Arial, sans-serif" font-size="8" fill="#1976D2" text-anchor="middle">Learn Today</text>
  <text x="150" y="170" font-family="Arial, sans-serif" font-size="8" fill="#1976D2" text-anchor="middle">...</text>
  <text x="180" y="170" font-family="Arial, sans-serif" font-size="8" fill="#1976D2" text-anchor="middle">Lead Tomorrow</text>
  
  <!-- Globe -->
  <circle cx="150" cy="190" r="15" fill="none" stroke="#1976D2" stroke-width="2"/>
  <line x1="135" y1="190" x2="165" y2="190" stroke="#1976D2" stroke-width="1"/>
  <line x1="150" y1="175" x2="150" y2="205" stroke="#1976D2" stroke-width="1"/>
  <path d="M135 185 Q150 180 165 185" stroke="#1976D2" stroke-width="1" fill="none"/>
  <path d="M135 195 Q150 200 165 195" stroke="#1976D2" stroke-width="1" fill="none"/>
  
  <!-- School name -->
  <text x="150" y="230" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1976D2" text-anchor="middle">WEBSTER INTERNATIONAL SCHOOL</text>
  
  <!-- Location -->
  <text x="150" y="245" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1976D2" text-anchor="middle">HATTON</text>
</svg>